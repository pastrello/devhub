name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: openssl version
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh install-system.sh scripts/bootstrap-ollama-lxc.sh scripts/repair-ollama-lxc.sh
